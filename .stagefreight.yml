version: 1
vars:
  github_org: PrPlanIT
  github_repo: DisplayWizard
  gitlab_group: PrPlanIT
  org: prplanit
  repo: DisplayWizard
builds:
  bin:
    builder: node
    command: corepack enable && pnpm install --no-frozen-lockfile && pnpm -r build && mkdir -p ui/desktop/bin && cp .stagefreight/dist/windows-amd64/dwiz.exe ui/desktop/bin/dwiz.exe && pnpm -C ui/desktop run pack
    depends_on: dwiz
    from: .
    image: electronuserland/builder:wine
    kind: binary
    output: ui/desktop/release/*.exe
    platforms:
      - windows/amd64
  dwiz:
    args:
      - -ldflags
      - -s -w -X github.com/PrPlanIT/DisplayWizard/src/version.Version={version} -X github.com/PrPlanIT/DisplayWizard/src/version.Commit={sha} -X github.com/PrPlanIT/DisplayWizard/src/version.BuildDate={date}
    builder: go
    env:
      CGO_ENABLED: "0"
    from: ./cmd/dwiz
    kind: binary
    output: dwiz
    platforms:
      - windows/amd64
scribe:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/scribe-go.yml
lint:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/lint-flagships.yml
security:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/security.yml
dependency:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/dependency.yml
commit:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/commit.yml
release:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/release.yml
manifest:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/manifest.yml
build_cache:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/build_cache.yml
ci:
  forge:
    - gitlab
  image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev
forges:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/forges.yml
git:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/git.yml
  tags:
    original:
      pattern: ^(beta|proto)_v\d+\.\d+$
metadata:
  category: applications
  description:
    - Windows desktop app for managing virtual displays.
    - Desktop utility for creating and arranging virtual displays on Windows, packaged as an Electron app over a Go core.
  license: MIT
  org: PrPlanIT
  title: Display Wizard
  topics:
    - windows
    - desktop
    - displays
    - electron
orgs:
  PrPlanIT:
    aliases:
      docker: prplanit
      ghcr: prplanit
      github: PrPlanIT
      handle: prplanit
    maintainer: PrPlanIT <precisionplanit@gmail.com>
publish:
  binaries:
    build: bin
    checksums: true
    format: auto
    include:
      - README.md
      - LICENSE
    kind: binary-archive
    name: VDisplay-Wizard-{version}-{os}-{arch}
    when:
      events:
        - tag
      git_tags:
        - stable
  binaries-dev:
    build: bin
    checksums: true
    format: auto
    kind: binary-archive
    name: VDisplay-Wizard-latest-dev-{os}-{arch}
    when:
      branches:
        - main
      events:
        - push
        - manual
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/publish-binary.yml
registries:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/registries.yml
repos:
  github-mirror:
    branches:
      default: v0.6.x-autohotkey
    forge: github
    project: PrPlanIT/DisplayWizard
    roles:
      - mirror
      - publish-origin
    sync:
      branches:
        prune: true
        scope: all
      releases:
        only:
          - original
        prune: true
        scope: all
      tags:
        prune: true
        scope: all
  primary:
    branches:
      default: main
    forge: gitlab
    project: PrPlanIT/DisplayWizard
    roles:
      - primary
    worktree: .
stencils:
  presets:
    - https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/stencils-base.yml
    - https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/stencils-status.yml
    - https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/stencils-go.yml
toolchains:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/toolchains.yml
  want:
    presets:
      - https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/toolchains-scanners.yml
      - https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/toolchains-go.yml
