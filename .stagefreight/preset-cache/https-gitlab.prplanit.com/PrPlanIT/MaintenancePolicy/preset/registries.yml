# Registry surfaces. default_path is an identity template — {org.<alias>} + {repo}
# resolve at each repo's own load (normalization) from its orgs:/metadata: blocks, so
# ONE preset serves every governed repo with zero per-repo vars.
registries:
  dockerhub:
    provider: docker
    url: docker.io
    credentials: DOCKER
    default_path: "{org.docker}/{repo}"
  harbor:
    provider: harbor
    url: cr.pcfae.com
    credentials: HARBOR
    default_path: "{org.docker}/{repo}"
  ghcr:
    provider: ghcr
    url: ghcr.io
    credentials: GHCR
    default_path: "{org.ghcr}/{repo}"
  # Harbor pull-through proxy for ghcr.io. Used by dependency discovery (dependency.registry)
  # to list a ghcr-based image's tags through Harbor with the existing Harbor credentials,
  # rather than authenticating to ghcr.io directly. OCI provider → distribution-API listing.
  ghcr-proxy:
    provider: harbor
    url: ghcr.cr.pcfae.com
    credentials: HARBOR
